# Configuración: UNETR ViT 3D puro (M7)
inherit_from: "configs/base.yaml"

experiment:
  name: "M7_unetr"
  framework: "monai"
  model_name: "unetr"
  pretrained: false

model_architecture:
  feature_size: 64
  in_channels: 1
  out_channels: 4
  hidden_size: 768
  mlp_dim: 3072
  num_heads: 12

training:
  patch_size: [128, 128, 128]
  batch_size: 2
  epochs: 500
  lr: 0.0001
  weight_decay: 0.00001
  optimizer: "AdamW"
  scheduler: "CosineAnnealingLR"
  val_interval: 5
  early_stopping_patience: 100
  amp: true

hardware:
  num_gpus: 4
  ddp: true
