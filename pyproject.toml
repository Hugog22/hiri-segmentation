[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hiri-segmentation"
version = "0.1.0"
description = "3D medical image segmentation for liver and kidney transplant volumetry"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "monai[all]>=1.3",
    "nnunetv2>=2.5",
    "nibabel>=5.0",
    "SimpleITK>=2.3",
    "numpy",
    "scipy",
    "scikit-learn",
    "scikit-image",
    "pandas",
    "matplotlib",
    "seaborn",
    "tqdm",
    "pyyaml",
    "wandb",
    "connected-components-3d",
    "medpy",
    "trimesh",
    "click"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov"
]

[project.scripts]
hiri-cli = "src.app.cli:main"
